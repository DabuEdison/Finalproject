{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Personalized Blogging Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #172029;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 100px auto;
            padding: 40px;
            border: 1px solid #0d1247;
            border-radius: 8px;
            background-color: #f4f8fb;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d1247;
            margin-bottom: 20px;
        }

        form input, form button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #0d1247;
            border-radius: 4px;
            font-size: 1rem;
        }

        form button {
            background-color: #0d1247;
            color: white;
            border: none;
            cursor: pointer;
        }

        form button:hover {
            background-color: #0d3f91;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login to Your Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    </div>
    <script src="{% static 'main.js' %}"></script>
</body>
</html>
