{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome - Personalized Blogging Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #0d1247;
        }

        nav {
            background-color: #0d1247;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .content {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        .content h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .content p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 30px;
        }

        .cta-button {
            padding: 12px 25px;
            background-color: #0d1247;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            text-decoration: none;
        }

        .cta-button:hover {
            background-color: #0d3f91;
        }
    </style>
</head>
<body>
    <nav>
        <h1>Blogging Platform</h1>
        <div>
            <span>Welcome, {{ user.username }}</span>
            <a href="{% url 'login' %}">Logout</a>
        </div>
    </nav>

    <div class="content">
        <h2>Welcome to Your Personalized Dashboard</h2>
        <p>Track your goals, write inspiring blogs, and stay consistent with your habits.</p>
        <a href="{% url 'posts' %}" class="cta-button">Start Writing</a>
        <a href="{% url 'goals' %}" class="cta-button" style="margin-left: 15px;">View Your Goals</a>
    </div>

    <script src="{% static 'main.js' %}"></script>
</body>
</html>
